<text x="800" y="1285.0" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#202020" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif">每场饭局只选择一个档口；所属食堂由档口确定，不在饭局中重复保存</text>
<text x="800" y="1328.0" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#202020" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif">取消时间为空表示未取消；当前饭局状态由取消时间和计划就餐时间计算</text>
