<text x="800" y="645.0" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#202020" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif">同一用户与同一档口只有一条收藏关联；取消收藏删除该关联</text>
