<text x="560" y="292.0" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#202020" font-family="Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif">M</text>
<rect x="1026.0" y="275.92" width="28.0" height="32.160000000000004" fill="white"/>
